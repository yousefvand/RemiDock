name: Build RemiDock

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  CMAKE_GENERATOR: Ninja

jobs:
  build:
    name: build-${{ matrix.distro }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}

    container:
      image: ${{ matrix.image }}
      options: --user 0

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
            install_script: scripts/install-arch.sh
            artifact_name: remidock-arch
            experimental: false
            cache_enabled: true
            cache_paths: |
              /var/cache/pacman/pkg

          - distro: fedora
            image: fedora:latest
            install_script: scripts/install-fedora.sh
            artifact_name: remidock-fedora
            experimental: false
            cache_enabled: false
            cache_paths: |
              /tmp/remidock-no-fedora-cache

          - distro: ubuntu-24.04
            image: ubuntu:24.04
            install_script: scripts/install-ubuntu.sh
            artifact_name: remidock-ubuntu-24.04
            experimental: false
            cache_enabled: true
            cache_paths: |
              /var/cache/apt/archives

          - distro: debian-trixie
            image: debian:trixie
            install_script: scripts/install-debian.sh
            artifact_name: remidock-debian-trixie
            experimental: false
            cache_enabled: true
            cache_paths: |
              /var/cache/apt/archives

          - distro: opensuse-tumbleweed
            image: opensuse/tumbleweed:latest
            install_script: scripts/install-opensuse.sh
            artifact_name: remidock-opensuse-tumbleweed
            experimental: false
            cache_enabled: true
            cache_paths: |
              /var/cache/zypp/packages

          - distro: alpine-edge
            image: alpine:edge
            install_script: scripts/install-alpine.sh
            artifact_name: remidock-alpine-edge
            experimental: true
            cache_enabled: true
            cache_paths: |
              /var/cache/apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark repository safe
        shell: sh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Prepare package cache directory
        if: matrix.cache_enabled
        shell: sh
        run: |
          set -eu
          case "${{ matrix.distro }}" in
            arch)
              mkdir -p /var/cache/pacman/pkg
              ;;
            ubuntu-24.04|debian-trixie)
              mkdir -p /var/cache/apt/archives
              ;;
            opensuse-tumbleweed)
              mkdir -p /var/cache/zypp/packages
              ;;
            alpine-edge)
              mkdir -p /var/cache/apk
              ;;
            *)
              echo "No package cache directory required for ${{ matrix.distro }}"
              ;;
          esac

      - name: Restore package cache
        if: matrix.cache_enabled
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_paths }}
          key: remidock-${{ matrix.distro }}-packages-${{ hashFiles('CMakeLists.txt', 'scripts/install-*.sh', 'scripts/_install-common.sh') }}
          restore-keys: |
            remidock-${{ matrix.distro }}-packages-

      - name: Make scripts executable
        shell: sh
        run: |
          chmod +x scripts/*.sh

      - name: Install dependencies on Alpine
        if: matrix.distro == 'alpine-edge'
        shell: sh
        run: |
          WITH_SUDO=0 SKIP_BUILD=1 "${{ matrix.install_script }}"

      - name: Install dependencies
        if: matrix.distro != 'alpine-edge'
        shell: bash
        run: |
          WITH_SUDO=0 SKIP_BUILD=1 "${{ matrix.install_script }}"

      - name: Build
        shell: bash
        run: |
          DISTRO_NAME="${{ matrix.distro }}" scripts/build-linux.sh

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          package_root="${{ matrix.artifact_name }}"

          rm -rf dist artifacts
          mkdir -p "dist/${package_root}" artifacts

          if [ -x build/bin/RemiDock ]; then
            cp build/bin/RemiDock "dist/${package_root}/"
          elif [ -x build/RemiDock ]; then
            cp build/RemiDock "dist/${package_root}/"
          else
            found="$(find build -type f -perm -111 -name 'RemiDock*' | head -n 1 || true)"
            if [ -z "${found}" ]; then
              echo "Could not find RemiDock executable"
              find build -maxdepth 4 -type f | sort
              exit 1
            fi
            cp "${found}" "dist/${package_root}/RemiDock"
          fi

          cp -a README.md LICENSE CHANGELOG.md "dist/${package_root}/" 2>/dev/null || true
          cp -a data images icon.png "dist/${package_root}/" 2>/dev/null || true
          cp -a scripts "dist/${package_root}/" 2>/dev/null || true

          tar -C dist -czf "artifacts/${package_root}.tar.gz" "${package_root}"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: create-versioned-main-release
    runs-on: ubuntu-24.04
    needs: build

    # Only pushes to main publish GitHub Releases.
    # Other branches and pull requests only create workflow artifacts.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create new versioned release for this main push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(release-artifacts/*.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts found." >&2
            exit 1
          fi

          version="$(sed -nE 's/^project\(RemiDock VERSION ([^ ]+).*/\1/p' CMakeLists.txt | head -n 1)"
          if [ -z "$version" ]; then
            echo "Could not read RemiDock version from CMakeLists.txt" >&2
            exit 1
          fi

          short_sha="${GITHUB_SHA::7}"
          release_tag="v${version}-${short_sha}"
          release_title="RemiDock v${version} (${short_sha})"
          notes="Automatic RemiDock Linux builds from main.

Version: v${version}
Commit: ${GITHUB_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$release_tag" >/dev/null 2>&1; then
            echo "Tag $release_tag already exists locally."
          else
            git tag "$release_tag" "$GITHUB_SHA"
          fi
          git push origin "$release_tag" || true

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag"               --title "$release_title"               --notes "$notes"               --prerelease=false               --latest
          else
            gh release create "$release_tag"               --title "$release_title"               --notes "$notes"               --latest
          fi

          gh release upload "$release_tag" "${files[@]}" --clobber
