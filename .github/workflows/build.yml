name: Build RemiDock

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  CMAKE_GENERATOR: Ninja

jobs:
  build:
    name: build-${{ matrix.distro }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}

    container:
      image: ${{ matrix.image }}
      options: --user 0

    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
            install_script: scripts/install-arch.sh
            artifact_name: remidock-arch
            experimental: false
            cache_paths: |
              /var/cache/pacman/pkg

          - distro: fedora
            image: fedora:latest
            install_script: scripts/install-fedora.sh
            artifact_name: remidock-fedora
            experimental: false
            cache_paths: |
              /var/cache/dnf
              /var/cache/libdnf5

          - distro: ubuntu-24.04
            image: ubuntu:24.04
            install_script: scripts/install-ubuntu.sh
            artifact_name: remidock-ubuntu-24.04
            experimental: false
            cache_paths: |
              /var/cache/apt
              /var/lib/apt/lists

          - distro: ubuntu-22.04
            image: ubuntu:22.04
            install_script: scripts/install-ubuntu.sh
            artifact_name: remidock-ubuntu-22.04
            experimental: false
            cache_paths: |
              /var/cache/apt
              /var/lib/apt/lists

          - distro: debian
            image: debian:trixie
            install_script: scripts/install-debian.sh
            artifact_name: remidock-debian
            experimental: false
            cache_paths: |
              /var/cache/apt
              /var/lib/apt/lists

          - distro: opensuse
            image: opensuse/tumbleweed:latest
            install_script: scripts/install-opensuse.sh
            artifact_name: remidock-opensuse
            experimental: false
            cache_paths: |
              /var/cache/zypp

          - distro: alpine
            image: alpine:edge
            install_script: scripts/install-alpine.sh
            artifact_name: remidock-alpine
            experimental: true
            cache_paths: |
              /var/cache/apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark repository safe
        shell: sh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Restore Qt/package cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_paths }}
          key: remidock-${{ matrix.distro }}-qt-${{ hashFiles('CMakeLists.txt', 'scripts/install-*.sh', 'scripts/_install-common.sh') }}
          restore-keys: |
            remidock-${{ matrix.distro }}-qt-

      - name: Make scripts executable
        shell: sh
        run: |
          chmod +x scripts/*.sh

      - name: Install dependencies on Alpine
        if: matrix.distro == 'alpine'
        shell: sh
        run: |
          WITH_SUDO=0 SKIP_BUILD=1 "${{ matrix.install_script }}"

      - name: Install dependencies
        if: matrix.distro != 'alpine'
        shell: bash
        run: |
          WITH_SUDO=0 SKIP_BUILD=1 "${{ matrix.install_script }}"

      - name: Build
        shell: bash
        run: |
          DISTRO_NAME="${{ matrix.distro }}" scripts/build-linux.sh

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          package_root="${{ matrix.artifact_name }}-${short_sha}"

          rm -rf dist artifacts
          mkdir -p "dist/${package_root}" artifacts

          if [ -x build/bin/RemiDock ]; then
            cp build/bin/RemiDock "dist/${package_root}/"
          elif [ -x build/RemiDock ]; then
            cp build/RemiDock "dist/${package_root}/"
          else
            found="$(find build -type f -perm -111 -name 'RemiDock*' | head -n 1 || true)"
            if [ -z "${found}" ]; then
              echo "Could not find RemiDock executable"
              find build -maxdepth 4 -type f | sort
              exit 1
            fi
            cp "${found}" "dist/${package_root}/RemiDock"
          fi

          cp -a README.md LICENSE CHANGELOG.md "dist/${package_root}/" 2>/dev/null || true
          cp -a data images icon.png "dist/${package_root}/" 2>/dev/null || true
          cp -a scripts "dist/${package_root}/" 2>/dev/null || true

          tar -C dist -czf "artifacts/${package_root}.tar.gz" "${package_root}"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: attach-release-artifacts
    runs-on: ubuntu-24.04
    needs: build

    # Release upload only from main branch or version tags.
    # Normal dev/feature branches only get workflow artifacts.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: |
          find release-artifacts -type f -maxdepth 2 -print

      - name: Create or update release from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          name: RemiDock main latest
          body: |
            Automatic RemiDock build from the main branch.

            Commit: ${{ github.sha }}
          files: release-artifacts/*.tar.gz
          prerelease: true
          make_latest: false

      - name: Create release from version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RemiDock ${{ github.ref_name }}
          body: |
            RemiDock ${{ github.ref_name }}

            Commit: ${{ github.sha }}
          files: release-artifacts/*.tar.gz
          prerelease: false
          make_latest: true