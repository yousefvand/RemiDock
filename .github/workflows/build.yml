name: Build RemiDock

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}

    container:
      image: ${{ matrix.image }}
      options: --user 0

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            image: archlinux:latest
            install_script: scripts/install-arch.sh
            artifact_name: remidock-arch
            install_shell: bash
            experimental: false

          - name: ubuntu-24.04
            image: ubuntu:24.04
            install_script: scripts/install-ubuntu.sh
            artifact_name: remidock-ubuntu-24.04
            install_shell: bash
            experimental: false

          - name: debian-trixie
            image: debian:trixie
            install_script: scripts/install-debian.sh
            artifact_name: remidock-debian-trixie
            install_shell: bash
            experimental: false

          - name: fedora
            image: fedora:latest
            install_script: scripts/install-fedora.sh
            artifact_name: remidock-fedora
            install_shell: bash
            experimental: false

          - name: alpine-edge
            image: alpine:edge
            install_script: scripts/install-alpine.sh
            artifact_name: remidock-alpine-edge
            install_shell: sh
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        shell: sh
        run: |
          chmod +x scripts/*.sh

      - name: Install dependencies
        shell: sh
        run: |
          set -eu

          if [ "${{ matrix.install_shell }}" = "sh" ]; then
            WITH_SUDO=0 SKIP_BUILD=1 sh "${{ matrix.install_script }}"
          else
            WITH_SUDO=0 SKIP_BUILD=1 bash "${{ matrix.install_script }}"
          fi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          DISTRO_NAME="${{ matrix.name }}" scripts/build-linux.sh

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package artifacts
          mkdir -p package artifacts

          package_name="${{ matrix.artifact_name }}"
          package_dir="package/${package_name}"

          mkdir -p "${package_dir}"

          if [ -x build/bin/RemiDock ]; then
            cp build/bin/RemiDock "${package_dir}/RemiDock"
          elif [ -x build/RemiDock ]; then
            cp build/RemiDock "${package_dir}/RemiDock"
          else
            found="$(find build -type f -perm -111 -name 'RemiDock*' | head -n 1 || true)"
            if [ -z "${found}" ]; then
              echo "Could not find RemiDock executable"
              find build -maxdepth 5 -type f | sort
              exit 1
            fi
            cp "${found}" "${package_dir}/RemiDock"
          fi

          cp -a README.md "${package_dir}/" 2>/dev/null || true
          cp -a LICENSE "${package_dir}/" 2>/dev/null || true
          cp -a CHANGELOG.md "${package_dir}/" 2>/dev/null || true
          cp -a data "${package_dir}/" 2>/dev/null || true
          cp -a images "${package_dir}/" 2>/dev/null || true
          cp -a icon.png "${package_dir}/" 2>/dev/null || true
          cp -a scripts "${package_dir}/" 2>/dev/null || true

          tar -C package -czf "artifacts/${package_name}.tar.gz" "${package_name}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create main release
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("CMakeLists.txt").read_text(encoding="utf-8", errors="ignore")
          text = re.sub(r"#.*", "", text)

          match = re.search(
              r"project\s*\(\s*RemiDock\b[\s\S]*?\bVERSION\s+([0-9]+(?:\.[0-9]+){1,3})",
              text,
              re.IGNORECASE,
          )

          print(match.group(1) if match else "0.4.6")
          PY
          )"

          short_sha="${GITHUB_SHA::7}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "release_name=RemiDock v${version} (${short_sha})" >> "$GITHUB_OUTPUT"

      - name: Show release info
        shell: bash
        run: |
          echo "Release tag:  ${{ steps.version.outputs.tag }}"
          echo "Release name: ${{ steps.version.outputs.release_name }}"
          find release-artifacts -type f -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            RemiDock v${{ steps.version.outputs.version }}

            Commit: ${{ github.sha }}
            Branch: main

            Artifacts are attached only for successful distro builds.
            openSUSE Tumbleweed is supported by script but excluded from CI because its repository CDN often times out.
            Alpine Edge is experimental.
          files: release-artifacts/*.tar.gz
          prerelease: false
          make_latest: true